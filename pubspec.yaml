name: novel_reader
description: 手机小说阅读器 —— 支持 TXT/EPUB 导入，切换背景色，调节字号行距，上下滚动阅读。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^12.0.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  path: ^1.9.0
  epubx: ^4.0.0
  fast_gbk: ^1.0.0
  scrollable_positioned_list: ^0.3.8
  http: ^1.0.0
  archive: ^3.6.1
  image_picker: ^1.1.2
  page_turn_animation: ^0.1.4
  mailer: ^7.2.0
  permission_handler: 12.0.1

flutter:
  uses-material-design: true
